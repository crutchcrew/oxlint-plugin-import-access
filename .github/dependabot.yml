version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      oxc:
        patterns:
          - "oxlint"
          - "oxlint-*"
          - "@oxlint/*"
          - "oxfmt"
          - "oxc-*"
      minors:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      minors-dev:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
