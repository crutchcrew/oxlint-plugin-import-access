name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.2.3)"
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          ref: ${{ env.TAG }}

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG_VERSION. Bump the version (e.g. \`npm version $TAG_VERSION\`) before tagging."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Test
        run: bun run test:coverage

      - name: Build
        run: bun run build

      - name: End-to-end
        run: bun run test:e2e

      # Trusted publishing (OIDC): no token needed once the package's trusted publisher is configured on npmjs.com.
      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
          else
            gh release create "$TAG" --generate-notes
          fi
