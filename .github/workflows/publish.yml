name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.2.3)"
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          ref: ${{ env.TAG }}

      - uses: oven-sh/setup-bun@v2

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${TAG#v}"
          PKG_VERSION="$(bun -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG_VERSION. Bump the version (e.g. \`bun pm version $TAG_VERSION --no-git-tag-version\`) before tagging."
            exit 1
          fi

      # Tests and oxlint load the plugin on Node.js; npm publishes with provenance.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - name: Test
        run: bun run test:coverage

      - name: Build
        run: bun run build

      - name: End-to-end
        run: bun run test:e2e

      # Trusted publishing (OIDC) once the package's trusted publisher is configured on npmjs.com.
      # npm can only configure that for an existing package, so the first release falls back to an
      # `NPM_TOKEN` repository secret; delete the secret after configuring the trusted publisher.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
          else
            gh release create "$TAG" --generate-notes
          fi
